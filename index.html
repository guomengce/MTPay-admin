<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/mtpay-favicon-horizontal.png?v=5" />
    <link rel="apple-touch-icon" href="/assets/mtpay-favicon-horizontal.png?v=5" />
    <title>MTPay-Admin</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .app-boot-loading {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        background: #f3f7fb;
      }

      .app-boot-loading__spinner {
        width: 38px;
        height: 38px;
        box-sizing: border-box;
        border: 3px solid rgba(9, 158, 151, 0.16);
        border-top-color: #099e97;
        border-radius: 50%;
        animation: app-boot-spin 0.75s linear infinite;
      }

      @keyframes app-boot-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loading__spinner { animation-duration: 1.5s; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot-loading" role="status" aria-label="页面加载中">
        <span class="app-boot-loading__spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
